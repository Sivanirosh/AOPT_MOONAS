# configs/config_model_NSGA.yaml
seed: 42

data:
  train:
    batch_size: 128
  val:
    batch_size: 128

model:
  supernet:
    C: 16
    num_cells: 4
    num_nodes: 4
    num_ops: 6
    dropout_p: 0.2
  hypernet:
    hidden_dim: 128
    depth: 3

optimizer:
  weight:
    lr: 0.025
    momentum: 0.9
  arch:
    lr: 0.01
    momentum: 0.9

search:
  strategy: nsga
  population_size: 20       # how many λ vectors per generation
  num_generations: 5        
  crossover_rate: 0.9
  mutation_rate: 0.1
  K: 10                     # how many Pareto‐elite to average gradients over
